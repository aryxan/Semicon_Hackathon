<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="waferGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Outer Wafer -->
  <circle cx="50" cy="50" r="46" fill="url(#waferGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Inner Glow -->
  <circle cx="50" cy="50" r="30" fill="url(#glow)" />
  
  <!-- Grid Lines (Silicon Dies) -->
  <path d="M 20 50 L 80 50 M 50 20 L 50 80 M 35 25 L 35 75 M 65 25 L 65 75 M 25 35 L 75 35 M 25 65 L 75 65" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
  
  <!-- Precision Crosshair (Alignment Mark) -->
  <path d="M 50 35 L 50 45 M 50 55 L 50 65 M 35 50 L 45 50 M 55 50 L 65 50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  
  <!-- Center Dot -->
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
</svg>